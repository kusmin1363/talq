[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "talq"
version = "0.1.0"
description = "Task-Adaptive Layer-wise Quantization for speech foundation models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
full = ["torch>=2.1", "transformers>=4.35", "soundfile>=0.12"]

[tool.setuptools.packages.find]
include = ["talq*"]

[tool.ruff]
line-length = 100
